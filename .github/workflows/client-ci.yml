# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Client CI

on:
  push:
    branches: [ master ]
    paths:
      - "ClientApp/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    branches: [ master ]
    paths:
      - "ClientApp/**"
      - ".github/workflows/client-ci.yml"

concurrency:
  group: node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
    CI: true
    NODE_VERSION: "24"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: yarn
        cache-dependency-path: ClientApp/yarn.lock
    - run: yarn --cwd ./ClientApp install --frozen-lockfile
    - run: yarn --cwd ./ClientApp lint
    - run: yarn --cwd ./ClientApp preact-cli build --no-esm
    - run: yarn --cwd ./ClientApp test
