name: .NET CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "ClientApp/**"
      - "**/*.md"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "ClientApp/**"
      - "**/*.md"

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test Unit
      run: dotnet run --project ./Test/AutoTest.Unit.Test --configuration Release --no-build
    - name: Test Integration
      run: dotnet run --project ./Test/AutoTest.Integration.Test --configuration Release --no-build
